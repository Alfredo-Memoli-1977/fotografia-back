<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FotoEmocional - Nuevo mensaje</title>
  </head>
  <body
    style="
      background-color: black;
      border: 1px solid #eab308;
      border-radius: 20px;
      margin: 0;
      font-family: &quot;Segoe UI&quot;, Arial, sans-serif;
    "
  >
    <header style="color: #eab308; text-align: center">
      <div>
        <img src="cid:logo" alt="Foto logo" />
      </div>
    </header>
    <main style="padding-left: 50px; padding-right: 50px">
      <h2 style="color: #eab308; text-align: center">Nueva consulta</h2>

      <p style="color: #eab308; text-align: center">
        <strong>Nombre:</strong> {{name}}
      </p>

      <p style="color: #eab308; text-align: center">
        <strong>Email:</strong> {{email}}
      </p>

      <p style="color: #eab308; text-align: center">
        <strong>Asunto:</strong> {{subject}}
      </p>

      <p style="color: #eab308; text-align: center">
        <strong>Mensaje:</strong>
      </p>

      <p
        style="
          color: #eab308;
          text-align: center;
          padding-right: 50px;
          padding-left: 50px;
        "
      >
        {{message}}
      </p>
    </main>
    <div
      style="
        background-color: #1e293b;
        padding: 16px;
        text-align: center;
        margin-top: 20px;
        border-bottom-left-radius: 20px;
        border-bottom-right-radius: 20px;
      "
    >
      <span style="color: white; text-align: center"
        >&copy; 2026 FotoEmocional</span
      >
    </div>
  </body>
</html>
